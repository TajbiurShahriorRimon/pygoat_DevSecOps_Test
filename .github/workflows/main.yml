name: CI

on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
      #Following line with sytax -ll and -ii indicate to have only medium, and high defects
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Atifact
        uses: actions/upload-artifact@v3
        # this segment of code will always execute even if the above code fails (it will fail since there are vulnerabilities.)
        if: always()
        with:
          name: bandit-findings
          path: bandit/report.json
